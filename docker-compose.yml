services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: knevo
      POSTGRES_USER: knevo
      POSTGRES_PASSWORD: knevo
    ports:
      - "5432:5432"
    volumes:
      - knevo_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d

volumes:
  knevo_data:
