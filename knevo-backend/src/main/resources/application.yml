spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knevo}
    username: ${DB_USER:knevo}
    password: ${DB_PASSWORD:knevo}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.knevo: DEBUG
