spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knevo?stringtype=unspecified}
    username: ${DB_USER:knevo}
    password: ${DB_PASSWORD:knevo}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.knevo: DEBUG

jwt:
  secret: ${JWT_SECRET:dev-secret-key-at-least-256-bits-long-for-hs256-algorithm}
  access-expiry-minutes: 15
  refresh-expiry-days: 7
