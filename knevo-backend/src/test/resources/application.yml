spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/knevo?stringtype=unspecified}
    username: ${DB_USER:knevo}
    password: ${DB_PASSWORD:knevo}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: test-secret-key-at-least-256-bits-long-for-hs256-algorithm
  access-expiry-minutes: 15
  refresh-expiry-days: 7
